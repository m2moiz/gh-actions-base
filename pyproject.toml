[project]
name = "gh-actions-base-example"
version = "0.1.0"
description = "Minimal package so the template can exercise its own CI."
readme = "README.md"
# Keep this range and the ci.yml matrix in the same commit, always.
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=example --cov-report=term"
