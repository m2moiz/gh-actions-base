# zizmor runs twice here: standalone in posture.yml, and again inside
# super-linter as GITHUB_ACTIONS_ZIZMOR. The standalone job passes on
# informational findings; super-linter's copy treats any finding as a failure.
# This file is what both of them read, so a deliberate exception belongs here
# rather than in either job's flags.
rules:
  superfluous-actions:
    ignore:
      # zizmor suggests `gh release create` in a script step instead of the
      # action, on the grounds that the runner already ships gh. True, and for
      # a release that is only a tag plus notes the script is genuinely
      # simpler.
      #
      # This is a template, and the step carries a commented `files: dist/*`
      # for the projects that will attach artifacts. Uploading assets by hand
      # is where the script version stops being simpler, so the action stays
      # and the informational finding is accepted rather than argued with.
      - release.yml
