name: release

# Tag on merge to main, then publish a release for the tag that was just cut.
#
# Ordering matters and is the thing most copies of this get wrong: the tag job
# must RUN FIRST and hand its tag to the release job. A release workflow keyed
# on `push: tags` instead will not fire here at all -- tags pushed by
# GITHUB_TOKEN do not trigger further workflow runs, by design, to stop
# recursion. Two jobs in one workflow sidesteps that entirely.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Never cancel a release mid-flight; a half-published release is worse than a
# slow one. Note this differs deliberately from every other file here.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: bump tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.new_tag }}
      bumped: ${{ steps.bump.outputs.part }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The action reads commit history to decide major/minor/patch.
          fetch-depth: 0
          persist-credentials: false

      # Reads Conventional Commit subjects: `feat:` bumps minor, `fix:` patch,
      # a `!` or BREAKING CHANGE bumps major. That is the same convention a
      # commit-message guard can enforce locally, so the two reinforce.
      - name: bump
        id: bump
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: "true"
          # Dry run on anything that is not a real merge to main. BOTH halves
          # matter: a manual dispatch is normally aimed at main -- it is the
          # only branch with the history the tag action needs -- so a ref check
          # alone reads a dispatch as a merge and mints a real tag and release
          # from a single click in the Actions tab. The event check is what
          # makes the comment above true.
          DRY_RUN: ${{ github.ref != 'refs/heads/main' || github.event_name != 'push' }}

  publish:
    name: gh-release
    needs: [tag]
    # No tag means no release. `if` rather than a failing step: a merge that
    # bumps nothing is normal, not an error.
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # zizmor suggests `gh release create` in a script step, since the runner
      # already ships gh. Fair for a release that is only a tag and notes.
      # This is a template though, and the step carries a commented
      # `files: dist/*` for projects that attach build artifacts -- hand
      # rolling asset upload is where the script stops being simpler.
      #
      # The directive sits below rather than here, and inline rather than in
      # .github/zizmor.yml. Both placements were tried and neither suppressed
      # anything: super-linter's copy of zizmor does not load the config file,
      # and an ignore comment only counts when it falls INSIDE the span the
      # finding reports -- this block is above the span's first line.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with: # zizmor: ignore[superfluous-actions] deliberate, see above
          tag_name: ${{ needs.tag.outputs.tag }}
          # Let GitHub write the notes from merged PRs rather than maintaining
          # a changelog by hand that drifts from the commits.
          generate_release_notes: true
          # Uncomment once the project builds artifacts worth attaching.
          # files: dist/*

  # OPT-IN: uncomment when the project publishes to PyPI.
  #
  # Trusted Publishing means there is NO PyPI token stored anywhere -- the
  # workflow proves its identity with a short-lived OIDC token instead, so the
  # credential that cannot leak is the one you never created. Configure the
  # publisher once at https://pypi.org/manage/account/publishing/
  #
  # pypi:
  #   name: publish
  #   needs: [tag]
  #   if: needs.tag.outputs.tag != ''
  #   runs-on: ubuntu-latest
  #   environment: release
  #   permissions:
  #     id-token: write        # OIDC, for Trusted Publishing
  #     attestations: write    # to sign the artifacts
  #     contents: read
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #     - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
  #     - run: uv build
  #     # Signs the artifacts so an installer can verify they came from THIS
  #     # workflow in THIS repository, and not from someone's laptop.
  #     - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
  #       with:
  #         subject-path: dist/*
  #     - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
